common:
  extra_dtc_overlay_files:
    - test.overlay
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
  tags:
    - bluetooth
    - host
  # Several cases wait for the command deadline of ten seconds
  timeout: 240
tests:
  bluetooth.host_cmd: {}
  bluetooth.host_cmd.tx_processor_syswq:
    extra_configs:
      - CONFIG_BT_TX_PROCESSOR_THREAD=n
  # Adds the suite of the command that only a central with SMP sends. Its
  # bond has a legacy LTK, which unlike that of LE Secure Connections comes
  # with a random number and a diversifier.
  bluetooth.host_cmd.central_smp:
    extra_configs:
      - CONFIG_BT_CENTRAL=y
      - CONFIG_BT_SMP=y
      - CONFIG_BT_SMP_SC_PAIR_ONLY=n
  # Runs the one suite that needs a controller without a reset on disable
  bluetooth.host_cmd.no_reset:
    extra_dtc_overlay_files:
      - no_reset.overlay
  # The vendor HCI extensions, whose presence the Host guesses here
  # (CONFIG_BT_HCI_VS_EXT_DETECT is on by default without a controller)
  bluetooth.host_cmd.vs:
    extra_configs:
      - CONFIG_BT_HCI_VS=y
