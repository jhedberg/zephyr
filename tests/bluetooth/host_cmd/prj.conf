CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_PERIPHERAL=y

# The suites look at what the Host does once the controller stops responding,
# which with asserts is to stop.
CONFIG_ASSERT=n
CONFIG_BT_ASSERT=n

CONFIG_LOG=y

# Lets the suites check that the command pool counts its buffers right
CONFIG_NET_BUF_POOL_USAGE=y

# The suites are picked by what the test controller is like, see
# TEST_DRIVER_RESETS: no scenario runs all of them.
CONFIG_ZTEST_VERIFY_RUN_ALL=n

# For the suite of the commands of a connection: a second command when a
# connection comes up, and no parameter update that the Host starts on its
# own unless the application has asked for one.
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
